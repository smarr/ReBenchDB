<!doctype html>
<html lang="en">
<head>
  <script src="/static/theme.js" type="module"></script>
  <title>ReBenchDB GitLab Runner Status for {%= it.project %}</title>
  {%- include('header.html', { rebenchVersion: it.rebenchVersion }) %}
  <link rel="stylesheet" href="/static/gitlab-runner.css?v={%= it.rebenchVersion %}">
</head>
<body>
  <div class="d-flex justify-content-center align-items-center vh-100">
  <form action="/runners" method="POST" enctype="application/x-www-form-urlencoded">
    <div class="mb-3">
      <input type="password" class="form-control" name="password" placeholder="password" required>
    </div>
  </form>
</div>
</body>
</html>
